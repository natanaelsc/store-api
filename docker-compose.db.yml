name: store

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: store-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - store-net
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  sqlserver-data:
    name: store-sqlserver-data

networks:
  store-net:
    name: store-net
    driver: bridge
